<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Garden Manager AI</title>
<meta name="description" content="Assistente personale per giardino, orto, frutteto e prato.">
<meta name="theme-color" content="#3d5a40">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="css/app.css">

  <div class="main">

      <button class="icon-btn only-mobile" id="menuBtn" aria-label="Menu">☰</button>
      <h1 id="pageTitle">Garden Manager</h1>
      <select id="gardenSwitch" aria-label="Giardino attivo"></select>

    <main id="view" tabindex="-1"></main>

  <nav class="tabbar" id="tabbar"></nav>

<div id="modalRoot"></div>
<div id="toastRoot" aria-live="polite"></div>
<script type="module" src="js/app.js"></script>

</html>
